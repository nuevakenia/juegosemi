<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>juegosemi</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; background: #0d1117; color: #e6edf3;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { padding: 28px 20px 8px; text-align: center; }
  h1 { font-size: clamp(26px, 5vw, 44px); margin: 0; }
  header p { color: #9fb0c5; font-size: clamp(15px, 2.4vw, 20px); margin: 8px 0 0; }
  main { padding: 20px; max-width: 1100px; margin: 0 auto; }
  .grupo { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
  a.tarra {
    display: flex; flex-direction: column; gap: 8px; text-decoration: none; color: inherit;
    background: #161b22; border: 2px solid #30363d; border-radius: 18px; padding: 22px;
    min-height: 160px; justify-content: center;
  }
  a.tarra:active { transform: scale(0.985); }
  a.tarra .emoji { font-size: clamp(38px, 7vw, 56px); line-height: 1; }
  a.tarra .titulo { font-size: clamp(20px, 3.4vw, 28px); font-weight: 800; }
  a.tarra .detalle { color: #9fb0c5; font-size: clamp(14px, 2.2vw, 17px); }
  footer { padding: 12px 20px 40px; text-align: center; color: #6e7d90; font-size: 13px; }
  .nota { background: #161b22; border-left: 4px solid #d29922; padding: 12px 16px; border-radius: 8px;
    color: #d8c9a3; font-size: 14px; margin-top: 18px; }
</style>
</head>
<body>
<header>
  <h1>Juegos de Emiliano</h1>
  <p>Elegí un juego. Todo funciona sin internet.</p>
</header>
<main>
  <div class="grupo" id="tarjetas"></div>
  <div class="nota" id="nota"></div>
</main>
<footer id="pie">juegosemi</footer>
<script type="module" src="./main.js"></script>
</body>
</html>
